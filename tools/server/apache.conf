# Augustinerkirche Wien: Apache 2.4 (eine Website auf Port 80)
#
# Ablegen unter /etc/apache2/sites-available/augustinerkirche.conf und aktivieren mit
#   a2enmod headers deflate
#   a2dissite 000-default
#   a2ensite augustinerkirche
#   apache2ctl configtest && systemctl reload apache2
# Die Website selbst liegt in /var/www/augustinerkirche (siehe ANLEITUNG.md).

<VirtualHost *:80>
    #ServerName www.beispiel.at          # bei einer eigenen Adresse eintragen
    DocumentRoot /var/www/augustinerkirche
    DirectoryIndex index.html
    AddDefaultCharset UTF-8
    ErrorLog ${APACHE_LOG_DIR}/augustinerkirche-error.log
    CustomLog ${APACHE_LOG_DIR}/augustinerkirche-access.log combined

    <Directory /var/www/augustinerkirche>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
    </Directory>

    AddType application/manifest+json .webmanifest
    AddType text/csv .csv
    AddType image/webp .webp

    # Antwortkoepfe. Die Content-Security-Policy steht schon in jeder Seite;
    # hier steht, was sich nur am Server einstellen laesst.
    Header always set Content-Security-Policy "frame-ancestors 'none'"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    #[test-anfang]
    # Test-Paket: Suchmaschinen aussperren (das Live-Paket hat diese Zeile nicht)
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
    #[test-ende]
    # Erst einschalten, wenn die Seite ueber https laeuft (Zertifikat, z. B. am Reverse-Proxy):
    #Header always set Strict-Transport-Security "max-age=31536000"

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/csv text/javascript application/javascript application/json application/manifest+json image/svg+xml
    </IfModule>

    # HTML, CSS, JS und Daten bei jedem Aufruf pruefen lassen (ETag), damit Aenderungen
    # sofort sichtbar sind; Bilder duerfen einen Tag im Browser bleiben.
    <FilesMatch "\.(html|css|js|json|csv|webmanifest)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <LocationMatch "^/data/">
        Header set Cache-Control "private, no-cache"
    </LocationMatch>
    <FilesMatch "\.(webp|png|jpe?g|gif|svg|ico|mp3|m4a|ogg|mp4|webm)$">
        Header set Cache-Control "public, max-age=86400, stale-while-revalidate=604800"
    </FilesMatch>

    # Versteckte Dateien und Sicherungskopien nie ausliefern
    # Werkzeuge und Notizen gehoeren nicht auf den Server; falls doch, nicht ausliefern
    <LocationMatch "^/(tools|docs|dist)/|\.(md|py|sh|conf|log|sha256|tar|gz|zip)$">
        Require all denied
    </LocationMatch>
    # Komprimierung (mod_deflate, bei Debian/Ubuntu meist schon aktiv: a2enmod deflate)
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/csv text/javascript application/javascript application/json application/manifest+json image/svg+xml
    </IfModule>
    <FilesMatch "(^\.|~$|\.(bak|tmp|crswap)$)">
        Require all denied
    </FilesMatch>

    #[verwaltung-anfang]
    # Die Verwaltung liegt auf einem eigenen Port mit Anmeldung (apache-verwaltung.conf), nicht hier
    RedirectMatch 404 "^/(admin/|js/admin|css/admin)"
    #[verwaltung-ende]
</VirtualHost>
