# Augustinerkirche Wien: nginx, Verwaltung (Server-Modus)
#
# Die Verwaltung speichert direkt auf diesem Server: Sie liest und schreibt die Dateien der Website
# per HTTP (GET, PUT, DELETE), ein Projektordner auf dem PC ist nicht noetig. Sie laeuft auf einem
# eigenen Port (damit getrennt von der oeffentlichen Website, auch fuer den Browser) und nur mit
# Anmeldung. Ablegen unter /etc/nginx/sites-available/augustinerkirche-verwaltung und aktivieren
# wie nginx.conf (siehe ANLEITUNG.md, Abschnitt "Verwaltung auf dem Server").
#
# Zwei Dinge muessen vorher da sein: das Zertifikat (die Anmeldung der Verwaltung braucht https)
# und die Benutzerdatei /etc/nginx/augustinerkirche.htpasswd (Anmeldung am Server).

# Schreib-Log: jedes Speichern, Loeschen oder Anlegen (PUT, DELETE, MKCOL) mit Benutzer der Server-Anmeldung.
# Diese Zeilen stehen ausserhalb von server { } (die Datei liegt im http-Block von nginx).
map $request_method $aug_schreibt {
    default 0;
    PUT     1;
    DELETE  1;
    MKCOL   1;
}
log_format augschreiben '$time_iso8601 $remote_user $remote_addr $request_method $request_uri $status $request_length';

server {
    listen 8443 ssl;
    #listen [::]:8443 ssl;               # fuer IPv6 einkommentieren
    server_name _;                       # bei einer eigenen Adresse hier eintragen
    ssl_certificate     /etc/nginx/augustinerkirche-tls/cert.pem;
    ssl_certificate_key /etc/nginx/augustinerkirche-tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/augustinerkirche;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Ohne Anmeldung kommt niemand an diese Seiten, auch nicht an admin/zugaenge.json
    # (dort stehen die Pruefsummen der Passwoerter) und nicht an die Schreibrechte unten.
    auth_basic "Augustinerkirche Verwaltung";
    auth_basic_user_file /etc/nginx/augustinerkirche.htpasswd;

    client_max_body_size 64m;            # Fotos und Hoerproben

    # Wer hat geschrieben? Eigene Logdatei nur fuer PUT, DELETE und MKCOL (siehe map oben)
    access_log /var/log/nginx/augustinerkirche-schreiben.log augschreiben if=$aug_schreibt;

    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    # private: kein gemeinsamer Zwischenspeicher (Cloudflare) darf etwas davon behalten; der Browser darf, muss aber pruefen
    add_header Cache-Control "private, no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    # Daran erkennt die Verwaltung, dass sie hier direkt speichern darf (statt in einen Projektordner)
    add_header X-Aug-Schreiben "ja" always;
    # Am Server angemeldeter Benutzer: Die Verwaltung gleicht ihn mit dem Zugang ab, damit man sich
    # nicht mit der Rolle eines anderen anmelden kann (ohne diesen Header gilt das alte Verhalten)
    add_header X-Aug-Benutzer $remote_user always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/csv text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # Reihenfolge der folgenden Regeln ist wichtig: zuerst sperren, dann ausliefern.

    # Versteckte Dateien (.git, .env ...) und Sicherungskopien nie ausliefern
    location ~ /\. { return 404; }
    location ~ (?:~|\.bak|\.tmp|\.crswap)$ { return 404; }

    # Schreiben nur hier (und nur mit Anmeldung). Auf jeden anderen Pfad antwortet nginx auf
    # PUT, DELETE und MKCOL mit 405: Programmcode (js, css, Seiten) laesst sich so nicht ueberschreiben.
    # data/: nur die Namen, die die Verwaltung wirklich schreibt (Tabellen und Einstellungen wie
    # news.csv, startseite-kirchenmusik.json, dazu das Hochamt-Archiv archiv/hochaemter-JJJJ.csv und archiv/jahre.json)
    location ~ "^/data/(?:[a-z-]+\.(?:csv|json)|archiv/hochaemter-\d{4}\.csv|archiv/jahre\.json)$" {
        dav_methods PUT;
        create_full_put_path on;
        dav_access user:rw group:r all:r;
        default_type text/csv;
    }
    # assets/: nur Bilder (img/) und Hoerproben (audio/) im Format, das die Verwaltung erzeugt
    location ~ "^/assets/(?:img|audio)/.+\.(?:webp|png|jpe?g|mp3)$" {
        dav_methods PUT DELETE;
        create_full_put_path on;
        dav_access user:rw group:r all:r;
    }
    location = /admin/zugaenge.json {
        dav_methods PUT;
        dav_access user:rw group:r all:r;
    }
    # OPTIONAL, schuetzt die Rollen am Server: Nur Entwickler und Admins duerfen zugaenge.json und
    # mitteilungen.json schreiben. Lesen (GET, HEAD) bleibt fuer alle Angemeldeten, sonst klappt die Anmeldung
    # der Verwaltung nicht. Vorgehen:
    #   1. Zweite Benutzerdatei anlegen, nur mit den Entwicklern/Admins:
    #        htpasswd -c /etc/nginx/augustinerkirche-admins.htpasswd <name>
    #      (die Namen muessen mit den Zugaengen in der Verwaltung uebereinstimmen)
    #   2. Die beiden Bloecke "location = /admin/zugaenge.json" und "... mitteilungen.json" durch die
    #      Fassung hier ersetzen (# vorne entfernen), dann: nginx -t && systemctl reload nginx
    #   Achtung: Wer nicht in der zweiten Datei steht, kann dann keine Zugaenge mehr speichern (z. B. das eigene
    #   Passwort unter "Profil") und bekommt eine Fehlermeldung. Erst einrichten, wenn das so gewollt ist.
    #
    # location = /admin/zugaenge.json {
    #     limit_except GET HEAD {
    #         auth_basic "Augustinerkirche Verwaltung (Admin)";
    #         auth_basic_user_file /etc/nginx/augustinerkirche-admins.htpasswd;
    #     }
    #     dav_methods PUT;
    #     dav_access user:rw group:r all:r;
    # }
    # location = /admin/mitteilungen.json {
    #     limit_except GET HEAD {
    #         auth_basic "Augustinerkirche Verwaltung (Admin)";
    #         auth_basic_user_file /etc/nginx/augustinerkirche-admins.htpasswd;
    #     }
    #     dav_methods PUT;
    #     dav_access user:rw group:r all:r;
    # }
    # Mitteilungen an alle in der Verwaltung (schreibt nur ein Entwickler, admin/mitteilungen.html)
    location = /admin/mitteilungen.json {
        dav_methods PUT;
        dav_access user:rw group:r all:r;
    }
    # Gemeinsames Aenderungsprotokoll (jedes Speichern in der Verwaltung, Entwickler sehen es unter "Aenderungen")
    location = /admin/protokoll.json {
        dav_methods PUT;
        dav_access user:rw group:r all:r;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
