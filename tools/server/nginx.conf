# Augustinerkirche Wien: nginx (eine Website auf Port 80)
#
# Ablegen unter /etc/nginx/sites-available/augustinerkirche und aktivieren mit
#   ln -sf /etc/nginx/sites-available/augustinerkirche /etc/nginx/sites-enabled/augustinerkirche
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
# Die Website selbst liegt in /var/www/augustinerkirche (siehe ANLEITUNG.md).

# Zwischenspeicher je Pfad, fuer den Browser und gemeinsame Zwischenspeicher wie Cloudflare:
#  - Bilder, Audio, Video: duerfen gespeichert werden, aber vor jeder Verwendung per ETag pruefen
#    (kurze Antwort 304, wenn unveraendert). Frueher galten sie einen Tag ungeprueft (+ 7 Tage
#    "stale"): ein in der Verwaltung ersetztes oder geloeschtes und neu hochgeladenes Bild mit
#    gleichem Namen (z. B. ein Plakat) erschien dann tagelang noch in der alten Fassung.
#  - data/ (Tabellen, laufend von der Verwaltung geaendert): nur im Browser (private), immer pruefen
#  - alles andere: immer per ETag pruefen, damit Aenderungen sofort sichtbar sind
map $uri $aug_cache {
    default "no-cache";
    ~*\.(?:webp|png|jpe?g|gif|svg|ico|mp3|m4a|ogg|mp4|webm)$ "public, no-cache";
    ~^/data/ "private, no-cache";
}

server {
    listen 80 default_server;
    #listen [::]:80 default_server;      # fuer IPv6 einkommentieren
    server_name _;                       # bei einer eigenen Adresse hier eintragen
    root /var/www/augustinerkirche;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Antwortkoepfe. Die Content-Security-Policy steht schon in jeder Seite;
    # hier steht, was sich nur am Server einstellen laesst.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Ohne "always": Fehlerantworten (z. B. 404 fuer ein eben geloeschtes Bild) bekommen keine
    # Speicherdauer und werden nicht zwischengespeichert, ein neu hochgeladenes Bild erscheint sofort
    add_header Cache-Control $aug_cache;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    #[test-anfang]
    # Test-Paket: Suchmaschinen aussperren (das Live-Paket hat diese Zeile nicht)
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    #[test-ende]
    # Erst einschalten, wenn die Seite ueber https laeuft (Zertifikat, z. B. am Reverse-Proxy):
    #add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/csv text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # Reihenfolge der folgenden Regeln ist wichtig: zuerst sperren, dann ausliefern.

    # Zertifikats-Pruefung (Let's Encrypt) muss erreichbar bleiben
    location ^~ /.well-known/ { }

    # Versteckte Dateien (.git, .env ...) und Sicherungskopien nie ausliefern
    location ~ /\. { return 404; }
    location ~ (?:~|\.bak|\.tmp|\.crswap)$ { return 404; }
    # Werkzeuge und Notizen gehoeren nicht auf den Server; falls doch, nicht ausliefern
    location ~ ^/(?:tools|docs|dist)/ { return 404; }
    location ~* \.(?:md|py|sh|conf|log|sha256|tar|gz|zip)$ { return 404; }

    #[verwaltung-anfang]
    # Die Verwaltung liegt auf einem eigenen Port mit Anmeldung (nginx-verwaltung.conf), nicht hier
    location ~ ^/(?:admin/|js/admin|css/admin) { return 404; }
    #[verwaltung-ende]

    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    location ~* \.csv$ {
        default_type text/csv;
    }

    # Alles andere (HTML, CSS, JS, Daten): bei jedem Aufruf per ETag pruefen lassen,
    # damit Aenderungen sofort sichtbar sind. Es gibt kein PHP und keine Umleitungen.
    location / {
        try_files $uri $uri/ =404;
    }
}
