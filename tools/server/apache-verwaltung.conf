# Augustinerkirche Wien: Apache 2.4, Verwaltung (Server-Modus)
#
# Die Verwaltung speichert direkt auf diesem Server: Sie liest und schreibt die Dateien der Website
# per HTTP (GET, PUT, DELETE, MKCOL; das ist WebDAV), ein Projektordner auf dem PC ist nicht noetig.
# Sie laeuft auf einem eigenen Port (damit getrennt von der oeffentlichen Website, auch fuer den
# Browser) und nur mit Anmeldung. Ablegen unter /etc/apache2/sites-available/augustinerkirche-verwaltung.conf
# (siehe ANLEITUNG.md, Abschnitt "Verwaltung auf dem Server"). Vorher einmal:
#   a2enmod dav dav_fs ssl headers deflate
#   in /etc/apache2/ports.conf die Zeile "Listen 8443" ergaenzen
# Zwei Dinge muessen vorher da sein: das Zertifikat (die Anmeldung der Verwaltung braucht https)
# und die Benutzerdatei /etc/apache2/augustinerkirche.htpasswd (Anmeldung am Server).
#
# ACHTUNG: Diese Datei wurde noch nicht mit einem echten Apache geprueft (die nginx-Fassung schon).
# Nach dem Einbinden "apache2ctl configtest" ausfuehren und die Pruefungen aus der Anleitung machen.

<VirtualHost *:8443>
    #ServerName www.beispiel.at          # bei einer eigenen Adresse eintragen
    SSLEngine on
    SSLCertificateFile    /etc/apache2/augustinerkirche-tls/cert.pem
    SSLCertificateKeyFile /etc/apache2/augustinerkirche-tls/key.pem

    DocumentRoot /var/www/augustinerkirche
    DirectoryIndex index.html
    AddDefaultCharset UTF-8
    ErrorLog ${APACHE_LOG_DIR}/augustinerkirche-verwaltung-error.log
    CustomLog ${APACHE_LOG_DIR}/augustinerkirche-verwaltung-access.log combined
    # Hoechstgroesse einer Datei: 64 MB (Fotos und Hoerproben)
    LimitRequestBody 67108864

    # Ohne Anmeldung kommt niemand an diese Seiten, auch nicht an admin/zugaenge.json
    # (dort stehen die Pruefsummen der Passwoerter) und nicht an die Schreibrechte unten.
    <Directory /var/www/augustinerkirche>
        Options -Indexes -MultiViews
        AllowOverride None
        AuthType Basic
        AuthName "Augustinerkirche Verwaltung"
        AuthUserFile /etc/apache2/augustinerkirche.htpasswd
        Require valid-user
    </Directory>

    AddType application/manifest+json .webmanifest
    AddType text/csv .csv
    AddType image/webp .webp

    Header always set Content-Security-Policy "frame-ancestors 'none'"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
    # Daran erkennt die Verwaltung, dass sie hier direkt speichern darf (statt in einen Projektordner)
    Header always set X-Aug-Schreiben "ja"

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/csv text/javascript application/javascript application/json application/manifest+json image/svg+xml
    </IfModule>
    # nichts zwischenspeichern: die Verwaltung soll immer den aktuellen Stand sehen
    Header set Cache-Control "private, no-cache"

    # Versteckte Dateien und Sicherungskopien nie ausliefern
    <FilesMatch "(^\.|~$|\.(bak|tmp|crswap)$)">
        Require all denied
    </FilesMatch>

    # Schreiben (WebDAV) nur in data/ und assets/ und nur fuer diese Dateitypen. Programmcode
    # (js, css, Seiten) laesst sich so nicht ueberschreiben. Die Regeln mit <If> ersetzen die
    # Anmeldung nicht, sie sperren zusaetzlich.
    <DirectoryMatch "^/var/www/augustinerkirche/(data|assets)(/|$)">
        Dav On
        Require valid-user
        <If "!(%{REQUEST_METHOD} in {'GET','HEAD','OPTIONS','PUT','DELETE','MKCOL'})">
            Require all denied
        </If>
        <If "%{REQUEST_METHOD} in {'PUT','DELETE'} && %{REQUEST_URI} !~ m#\.(csv|json|webp|png|jpe?g|gif|mp3|m4a|ogg|pdf)$#">
            Require all denied
        </If>
        <If "%{REQUEST_METHOD} == 'DELETE' && %{REQUEST_URI} =~ m#^/data/#">
            Require all denied
        </If>
    </DirectoryMatch>

    # Die Zugaenge (erster Zugang bei der Einrichtung, neue Zugaenge) darf die Verwaltung schreiben, sonst nichts in admin/
    <Location "/admin/zugaenge.json">
        Dav On
        Require valid-user
        <If "!(%{REQUEST_METHOD} in {'GET','HEAD','OPTIONS','PUT'})">
            Require all denied
        </If>
    </Location>
    # Mitteilungen an alle in der Verwaltung (schreibt nur ein Entwickler)
    <Location "/admin/mitteilungen.json">
        Dav On
        Require valid-user
        <If "!(%{REQUEST_METHOD} in {'GET','HEAD','OPTIONS','PUT'})">
            Require all denied
        </If>
    </Location>
    # Gemeinsames Aenderungsprotokoll (jedes Speichern in der Verwaltung)
    <Location "/admin/protokoll.json">
        Dav On
        Require valid-user
        <If "!(%{REQUEST_METHOD} in {'GET','HEAD','OPTIONS','PUT'})">
            Require all denied
        </If>
    </Location>
</VirtualHost>
