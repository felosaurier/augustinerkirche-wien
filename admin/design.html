<title>Kopfzeile — Verwaltung Augustinerkirche Wien</title>
<link rel="stylesheet" href="../css/style.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<script src="../js/thema.js"></script>

<body class="adm">
<a class="skip-link" href="#main">Zum Inhalt springen</a>
<header class="adm-top" id="adm-top"></header>

<div class="adm-head">
  <div class="adm-head-in">
    <div>
      <div class="ph-tag">Verwaltung</div>
      <h1 class="ph-title">Kopfzeile <em>der Bereiche</em></h1>
      <p class="ph-sub">Farbe der Titelzeile, Logo und der Text daneben für jede Hauptseite. Die Schrift wird auf hellen Farben automatisch dunkel, damit sie lesbar bleibt. Die Logos liegen in <code>assets/logo/</code>.</p>
    </div>
  </div>
</div>

<main class="adm-main" id="main">
  <div data-adm-folder></div>
  <form id="ds-form" novalidate autocomplete="off">
    <div id="ds-list"><p class="adm-muted">Wird geladen …</p></div>
    <div class="adm-inline-foot rt-foot">
      <span class="adm-muted" id="ds-state"></span>
      <button type="submit" class="btn btn-dark" id="ds-save" data-icon="check">Speichern</button>
    </div>
  </form>
</main>

</body>
