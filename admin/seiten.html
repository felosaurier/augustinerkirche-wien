<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'"/>
<meta name="color-scheme" content="light"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="referrer" content="same-origin"/>
<meta name="theme-color" content="#10192e"/>
<link rel="icon" href="../favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png"/>
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"/>
<title>Seite bearbeiten — Verwaltung Augustinerkirche Wien</title>
<link rel="stylesheet" href="../css/style.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<script src="../js/hochaemter-data.js"></script>
<script src="../js/admin/admin.js"></script>
<script src="../js/admin/admin-seiten.js" defer></script>
</head>
<body class="adm">
<a class="skip-link" href="#main">Zum Inhalt springen</a>
<header class="adm-top" id="adm-top"></header>

<div class="adm-head">
  <div class="adm-head-in">
    <div>
      <div class="ph-tag">Verwaltung</div>
      <h1 class="ph-title" id="sx-title">Seite</h1>
      <p class="ph-sub" id="sx-sub">Kopf, Bereiche und Abschnitte der Seite mit allen Texten, Bildern, Karten, Listen und Tabellen. Module wie Aktuelles oder die Hochämter werden in ihren eigenen Bereichen gepflegt.</p>
    </div>
    <div class="adm-head-actions">
      <button type="button" class="btn btn-dark" id="sx-preview" data-icon="eye">Vorschau</button>
      <a class="btn btn-outline" id="sx-view" href="#" target="_blank" rel="noopener" data-icon="external">Seite ansehen</a>
    </div>
  </div>
</div>

<main class="adm-main" id="main">
  <div data-adm-folder></div>
  <div id="sx-note"></div>

  <form id="sx-form" novalidate autocomplete="off">
    <div id="sx-list"><p class="adm-muted">Die Seite wird geladen …</p></div>
    <div class="adm-inline-foot">
      <span class="adm-muted" id="sx-state"></span>
      <button type="submit" class="btn btn-dark" id="sx-save" data-icon="check">Seite speichern</button>
    </div>
  </form>
</main>

</body>
</html>
