<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'"/>
<meta name="color-scheme" content="light"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="referrer" content="same-origin"/>
<meta name="theme-color" content="#10192e"/>
<link rel="icon" href="../favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png"/>
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"/>
<title>Übersicht — Verwaltung Augustinerkirche Wien</title>
<link rel="stylesheet" href="../css/style.css"/>
<link rel="stylesheet" href="../css/admin.css"/>
<script src="../js/hochaemter-data.js"></script>
<script src="../js/admin/admin.js"></script>
<script src="../js/admin/admin-uebersicht.js" defer></script>
</head>
<body class="adm">
<a class="skip-link" href="#main">Zum Inhalt springen</a>
<header class="adm-top" id="adm-top"></header>

<div class="adm-head">
  <div class="adm-head-in">
    <div>
      <h1 class="ph-title" id="ov-greet">Grüß Gott</h1>
      <p class="ph-sub" id="ov-today"></p>
    </div>
    <div class="adm-head-actions" id="ov-quick" hidden></div>
  </div>
</div>

<main class="adm-main" id="main">
  <div data-adm-folder></div>

  <div class="ov-top">
    <section class="ov-board" id="ov-board" aria-label="Nächstes Hochamt" hidden></section>

    <section class="adm-panel ov-todo" aria-labelledby="ov-todo-h">
      <h2 class="adm-panel-title" id="ov-todo-h">Noch offen <span class="ov-count" id="ov-todo-n"></span></h2>
      <p class="adm-panel-sub">Was bei den nächsten Terminen noch fehlt.</p>
      <div id="ov-todo"><p class="adm-muted">Wird geladen …</p></div>
    </section>
  </div>

  <section class="ov-stats" id="ov-stats" aria-label="Auf einen Blick" hidden></section>

  <section class="ov-areas" aria-labelledby="ov-areas-h">
    <h2 class="ov-areas-h" id="ov-areas-h">Bereiche</h2>
    <div class="adm-areagroups" id="ov-areas"><p class="adm-muted">Wird geladen …</p></div>
  </section>

  <section class="adm-panel ov-log" aria-labelledby="ov-log-h" hidden>
    <h2 class="adm-panel-title" id="ov-log-h">Zuletzt geändert</h2>
    <p class="adm-panel-sub" id="ov-log-sub">Deine letzten Änderungen.</p>
    <div id="ov-log"></div>
  </section>
</main>

</body>
</html>
